    <script src="script.js"></script>
    <script>
        function positionLogosInSphere() {
            const container = document.querySelector('.globe-container');
            const logos = document.querySelectorAll('.floating-logo');
            const count = logos.length;
            const radius = 200;

            logos.forEach((logo, i) => {
                const phi = Math.acos(-1 + (2 * i) / count);
                const theta = Math.sqrt(count * Math.PI) * phi;

                const x = radius * Math.cos(theta) * Math.sin(phi);
                const y = radius * Math.sin(theta) * Math.sin(phi);
                const z = radius * Math.cos(phi);

                logo.style.left = '50%';
                logo.style.top = '50%';
                logo.style.transform = `translate3d(calc(-50% + ${x}px), calc(-50% + ${y}px), ${z}px)`;
            });
        }

        window.addEventListener('load', positionLogosInSphere);
        window.addEventListener('resize', positionLogosInSphere);
    </script>
