<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills | Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Dancing+Script:wght@700&display=swap"
        rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <a href="index.html" class="back-arrow-btn">
        <i class="fa-solid fa-arrow-left"></i>
    </a>
    <div class="split-container">
        <div class="split-bg">
            <div class="left-side"></div>
            <div class="right-side"></div>
        </div>
        <main class="content">
            <div class="left-content">
                <div class="skills-page-container">
                    <h1 class="skills-main-title">SKILLS</h1>

                    <div class="skills-section">
                        <div class="section-header frontend-header">
                            <i class="fa-solid fa-table-cells"></i> FRONTEND
                        </div>
                        <div class="skills-list">
                            <div class="skill-item"><i class="fa-brands fa-html5" style="color: #E34F26;"></i> HTML
                            </div>
                            <div class="skill-item"><i class="fa-brands fa-css3-alt" style="color: #1572B6;"></i> CSS
                            </div>
                            <div class="skill-item"><i class="fa-brands fa-js" style="color: #F7DF1E;"></i> JavaScript
                            </div>
                            <div class="skill-item"><i class="fa-solid fa-wind" style="color: #06B6D4;"></i> Tailwind
                                CSS</div>

                        </div>
                    </div>

                    <div class="skills-section">
                        <div class="section-header backend-header">
                            <i class="fa-solid fa-table-cells"></i> BACKEND
                        </div>
                        <div class="skills-list">
                            <div class="skill-item"><i class="fa-brands fa-node-js" style="color: #339933;"></i> Node.js
                            </div>
                            <div class="skill-item"><i class="fa-solid fa-server" style="color: #ffffff;"></i> Express
                            </div>

                            <div class="skill-item"><i class="fa-solid fa-flask" style="color: #ffffff;"></i> Flask
                            </div>
                            <div class="skill-item"><i class="fa-solid fa-cloud" style="color: #ff4b2b;"></i> REST APIs
                            </div>
                        </div>
                    </div>

                    <div class="skills-section">
                        <div class="section-header db-header">
                            <i class="fa-solid fa-table-cells"></i> DATABASES
                        </div>
                        <div class="skills-list">
                            <div class="skill-item"><i class="fa-solid fa-leaf" style="color: #47A248;"></i> MongoDB
                            </div>
                            <div class="skill-item"><i class="fa-solid fa-database" style="color: #336791;"></i>
                                PostgreSQL</div>
                        </div>
                    </div>

                    <div class="skills-section">
                        <div class="section-header lang-header">
                            <i class="fa-solid fa-table-cells"></i> LANGUAGES
                        </div>
                        <div class="skills-list">
                            <div class="skill-item"><i class="fa-brands fa-python" style="color: #3776AB;"></i> Python
                            </div>
                            <div class="skill-item"><i class="fa-solid fa-c" style="color: #00599C;"></i> C++</div>
                        </div>
                    </div>

                    <div class="skills-section">
                        <div class="section-header tools-header">
                            <i class="fa-solid fa-table-cells"></i> TOOLS
                        </div>
                        <div class="skills-list">
                            <div class="skill-item"><i class="fa-brands fa-git-alt" style="color: #F05032;"></i> Git
                            </div>
                            <div class="skill-item"><i class="fa-brands fa-github" style="color: #ffffff;"></i> GitHub
                            </div>
                            <div class="skill-item"><i class="fa-solid fa-code" style="color: #007ACC;"></i> VS Code
                            </div>
                            <div class="skill-item"><i class="fa-solid fa-rocket" style="color: #FF6C37;"></i> Postman
                            </div>
                            <div class="skill-item"><i class="fa-solid fa-triangle-exclamation"
                                    style="color: #ffffff;"></i> Vercel</div>
                            <div class="skill-item"><i class="fa-brands fa-figma" style="color: #F24E1E;"></i> Figma
                            </div>
                        </div>
                    </div>



                </div>
            </div>
            <div class="right-content">
                <div class="logo-cloud">
                    <!-- Frontend -->
                    <i class="fa-brands fa-html5 floating-logo"
                        style="top: 10%; left: 20%; font-size: 6rem; color: #E34F26;"></i>
                    <i class="fa-brands fa-css3-alt floating-logo"
                        style="top: 70%; left: 70%; font-size: 6.5rem; color: #1572B6;"></i>
                    <i class="fa-brands fa-js floating-logo"
                        style="top: 45%; left: 30%; font-size: 5.5rem; color: #F7DF1E;"></i>
                    <i class="fa-solid fa-wind floating-logo"
                        style="top: 20%; left: 50%; font-size: 5rem; color: #06B6D4;"></i>

                    <!-- Backend -->
                    <i class="fa-brands fa-node-js floating-logo"
                        style="top: 25%; left: 80%; font-size: 7rem; color: #339933;"></i>
                    <i class="fa-solid fa-server floating-logo"
                        style="top: 55%; left: 10%; font-size: 5rem; color: #333333;"></i>
                    <i class="fa-solid fa-flask floating-logo"
                        style="top: 85%; left: 40%; font-size: 5.5rem; color: #444444;"></i>
                    <i class="fa-solid fa-cloud floating-logo"
                        style="top: 5%; left: 65%; font-size: 5rem; color: #ff4b2b;"></i>

                    <!-- Databases -->
                    <i class="fa-solid fa-leaf floating-logo"
                        style="top: 75%; left: 25%; font-size: 6rem; color: #47A248;"></i>
                    <i class="fa-solid fa-database floating-logo"
                        style="top: 35%; left: 55%; font-size: 5.5rem; color: #336711;"></i>

                    <!-- Languages -->
                    <i class="fa-brands fa-python floating-logo"
                        style="top: 60%; left: 85%; font-size: 7.5rem; color: #3776AB;"></i>
                    <i class="fa-solid fa-c floating-logo"
                        style="top: 40%; left: 15%; font-size: 5.5rem; color: #00599C;"></i>

                    <!-- Tools -->
                    <i class="fa-brands fa-git-alt floating-logo"
                        style="top: 15%; left: 35%; font-size: 5rem; color: #F05032;"></i>
                    <i class="fa-brands fa-github floating-logo"
                        style="top: 50%; left: 45%; font-size: 6.5rem; color: #181717;"></i>
                    <i class="fa-solid fa-code floating-logo"
                        style="top: 80%; left: 60%; font-size: 5rem; color: #007ACC;"></i>
                    <i class="fa-solid fa-rocket floating-logo"
                        style="top: 65%; left: 50%; font-size: 5.5rem; color: #FF6C37;"></i>
                    <i class="fa-solid fa-triangle-exclamation floating-logo"
                        style="top: 30%; left: 65%; font-size: 5rem; color: #000000;"></i>
                    <i class="fa-brands fa-figma floating-logo"
                        style="top: 90%; left: 15%; font-size: 5.5rem; color: #F24E1E;"></i>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>

</html>
