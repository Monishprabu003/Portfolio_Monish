<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monish Prabu — AI Engineer & Full-Stack Developer</title>
  <meta name="description" content="Portfolio of Monish Prabu B — AI Engineer specializing in LLMs, RAG, and AI agent workflows." />
  <meta name="author" content="Monish Prabu B" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;700;800;900&family=Syne:wght@700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <link rel="stylesheet" href="style.css" />
</head>
<body class="theme-minimal">

  <!-- ══════════════════════════════════════════
       1. EYE-LID / GREETINGS OVERLAY (Cinematic Shutter)
  ══════════════════════════════════════════ -->
  <div id="eye-loader" class="eye-overlay eye-open">
    <!-- Top & Bottom Eyelid Shutters -->
    <div class="eyelid eyelid-top"></div>
    <div class="eyelid eyelid-bottom"></div>

    <!-- Greetings Container -->
    <div class="greetings-container">
      <div class="greeting-word-wrap">
        <span id="greeting-text" class="greeting-text">HELLO</span>
      </div>
      <div class="greeting-indicator">
        <span class="greeting-dot"></span>
        <span class="greeting-sub">welcome</span>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════
       2. CUSTOM CURSOR
  ══════════════════════════════════════════ -->
  <div id="cursor-dot"></div>
  <div id="cursor-ring"></div>

  <!-- ══════════════════════════════════════════
       3. HERO / FIRST PAGE (Exact Match to Image 1)
  ══════════════════════════════════════════ -->
  <main class="hero-stage" id="hero-stage">

    <!-- Ambient Studio Lighting / Vignette -->
    <div class="studio-lighting"></div>

    <!-- ── TOP NAVIGATION ── -->
    <header class="top-nav">
      <!-- Left: Availability Pill -->
      <div class="pill-badge">
        <span class="status-pulse"></span>
        <span>Available for New Project</span>
      </div>

      <!-- Center: Floating Menu -->
      <nav class="floating-nav-menu" aria-label="Main Navigation">
        <a href="#work" class="nav-item active">Work</a>
        <a href="#service" class="nav-item">Service</a>
        <a href="#experience" class="nav-item">Experience</a>
        <a href="#contact" class="nav-item">Contact</a>
      </nav>

      <!-- Right: Let's Talk CTA -->
      <a href="mailto:monishprabu392005@gmail.com" class="btn-talk" id="btn-talk">
        <span>Let's Talk</span>
        <i class="fa-solid fa-arrow-up-right-from-square"></i>
      </a>
    </header>

    <!-- ── GIANT TYPOGRAPHY BANNER ── -->
    <div class="hero-brand-title">
      <!-- Outlined Geometric Letters ("MR>" or "MP>") -->
      <span class="brand-outline">MR&gt;</span>
      <!-- Bold Solid Black Name -->
      <span class="brand-solid">MONISH</span>
    </div>

    <!-- ── CENTER DEVELOPER PORTRAIT ── -->
    <div class="portrait-wrapper">
      <div class="portrait-aura"></div>
      <img src="images/avatar_clean.png" alt="Monish Prabu — AI Engineer" class="portrait-img" id="hero-avatar" />
      <div class="portrait-base-fade"></div>
    </div>

    <!-- ── BOTTOM LEFT: ROLE & BIO ── -->
    <div class="hero-bottom-left">
      <h2 class="role-title">AI Engineer</h2>
      <p class="role-desc">
        Architecting intelligent systems, fine-tuning LLMs, and building high-performance AI agent workflows.
      </p>
      <a href="mailto:monishprabu392005@gmail.com" class="btn-collaborate" id="btn-collaborate">
        <span>Let's collaborate</span>
        <i class="fa-solid fa-arrow-up-right-from-square"></i>
      </a>
    </div>

    <!-- ── BOTTOM RIGHT: SOCIAL & RESUME PILLS ── -->
    <div class="hero-bottom-right">
      <a href="https://github.com/Monishprabu003" target="_blank" rel="noopener" class="social-pill" id="pill-github">
        <i class="fa-brands fa-github"></i>
        <span>GitHub</span>
      </a>

      <a href="https://www.linkedin.com/in/monish-prabu/" target="_blank" rel="noopener" class="social-pill" id="pill-linkedin">
        <i class="fa-brands fa-linkedin"></i>
        <span>LinkedIn</span>
      </a>

      <a href="https://leetcode.com/u/Macz_moni_/" target="_blank" rel="noopener" class="social-pill" id="pill-leetcode">
        <i class="fa-solid fa-code"></i>
        <span>LeetCode</span>
      </a>

      <a href="mailto:monishprabu392005@gmail.com" class="social-pill pill-resume" id="pill-resume">
        <i class="fa-solid fa-file-arrow-down"></i>
        <span>Resume</span>
        <i class="fa-solid fa-arrow-down pill-arrow-icon"></i>
      </a>
    </div>

    <!-- Intro Replay Button (Discreet Floating Control) -->
    <button class="btn-replay-intro" id="btn-replay-intro" title="Replay Eye Shutter & Greetings">
      <i class="fa-solid fa-eye"></i>
      <span>Intro</span>
    </button>
  </main>

  <script src="script.js"></script>
</body>
</html>
